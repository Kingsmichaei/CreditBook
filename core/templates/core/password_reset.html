{% extends 'core/auth_base.html' %}

{% block title %}Reset password | CreditBook{% endblock %}

{% block content %}
  <h2 class="fw-bold mb-2">Reset your password</h2>
  <p class="text-muted mb-4">Enter the email connected to your CreditBook account and we’ll send reset instructions.</p>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="id_email">Your registered email address</label>
      <input type="email" name="email" id="id_email" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary w-100">Send reset link</button>
  </form>
{% endblock %}
