{% extends 'core/auth_base.html' %}

{% block title %}Reset password | CreditBook{% endblock %}

{% block content %}
  <h1 class="auth-title">Reset your password</h1>
  <p class="auth-sub">Enter the email address on your CreditBook account and we'll send you a link to choose a new password.</p>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label class="field-label" for="id_email">Email address</label>
      <div class="input-wrap">
        <i class="bi bi-envelope input-icon"></i>
        <input type="email" name="email" id="id_email" placeholder="name@company.com" autocomplete="email" autofocus required />
      </div>
    </div>
    <button type="submit" class="btn-submit">Send reset link</button>
  </form>
  <p class="auth-foot"><a href="{% url 'login' %}"><i class="bi bi-arrow-left"></i> Back to sign in</a></p>
{% endblock %}
