{% extends 'core/auth_base.html' %}

{% block title %}Password updated | CreditBook{% endblock %}

{% block content %}
  <div class="notice notice-success"><i class="bi bi-check-circle-fill"></i><div>Password changed</div></div>
  <h1 class="auth-title">You're all set</h1>
  <p class="auth-sub">Your password has been updated. Sign in with your new password to continue.</p>
  <a href="{% url 'login' %}" class="btn btn-primary w-100">Continue to sign in</a>
{% endblock %}
