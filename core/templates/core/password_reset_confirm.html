{% extends 'core/auth_base.html' %}

{% block title %}Choose a new password | CreditBook{% endblock %}

{% block content %}
  <h2 class="fw-bold mb-2">Choose a new password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100 mt-3">Update password</button>
  </form>
{% endblock %}
