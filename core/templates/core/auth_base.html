{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" sizes="96x96" href="{% static 'icons/favicon-96x96.png' %}">
  <link rel="icon" href="{% static 'icons/favicon.svg' %}" type="image/svg+xml" sizes="any">
  <link rel="icon" href="{% static 'icons/favicon.ico' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'icons/site.webmanifest' %}">
  <title>{% block title %}CreditBook{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --accent: #00e5a0;
      --accent-2: #f59e0b;
      --accent-3: #f43f5e;
      --accent-blue: #3b82f6;
      --radius: 24px;
      --border-radius-sm: 16px;
      --transition: 0.3s ease;
      --font-family: Inter, Arial, sans-serif;
    }

    [data-theme="dark"] {
      --bg: #090c14;
      --bg-2: #0e1320;
      --bg-3: #131929;
      --surface: rgba(255,255,255,0.06);
      --surface-2: rgba(255,255,255,0.1);
      --border: rgba(255,255,255,0.11);
      --text: #f0f4ff;
      --text-2: rgba(240,244,255,0.7);
      --text-3: rgba(240,244,255,0.5);
      --glass-blur: blur(24px) saturate(180%);
      --shadow: 0 24px 60px rgba(0,0,0,0.35);
    }

    [data-theme="light"] {
      --bg: #f0f4f8;
      --bg-2: #e8eef5;
      --bg-3: #ffffff;
      --surface: rgba(255,255,255,0.95);
      --surface-2: rgba(255,255,255,0.98);
      --border: rgba(13,27,42,0.12);
      --text: #0f172a;
      --text-2: rgba(15,23,42,0.68);
      --text-3: rgba(15,23,42,0.45);
      --glass-blur: blur(24px) saturate(180%);
      --shadow: 0 24px 60px rgba(15,23,42,0.08);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }
    body {
      margin: 0;
      font-family: var(--font-family);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% -10%, rgba(0,229,160,0.1), transparent 35%),
        radial-gradient(circle at 100% 110%, rgba(59,130,246,0.08), transparent 35%);
      pointer-events: none;
      z-index: -1;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px;
      backdrop-filter: var(--glass-blur);
      position: relative;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 3px;
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      z-index: 10;
    }

    .theme-toggle-thumb {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text);
      display: grid;
      place-items: center;
      transition: transform var(--transition), background var(--transition);
      color: var(--bg);
    }

    [data-theme="light"] .theme-toggle-thumb {
      transform: translateX(22px);
    }

    .form-control {
      background: var(--bg-3);
      color: var(--text);
      border: 1px solid var(--border);
      transition: border-color var(--transition), background var(--transition), color var(--transition);
    }

    .form-control:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 0.15rem rgba(0,229,160,0.18);
      outline: none;
    }

    .form-label, .form-text, .text-muted, p, label {
      color: var(--text-2) !important;
    }

    /* Ensure outline buttons and muted text are readable in both themes */
    .auth-card .text-muted, .auth-card p, .auth-card .form-text {
      color: var(--text-2) !important;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-blue));
      border: none;
      color: #fff;
    }

    .btn-outline-light {
      /* Override Bootstrap defaults to use theme-aware colors */
      color: var(--text) !important;
      border-color: var(--border) !important;
      background: transparent !important;
    }

    .btn-outline-light:hover, .btn-outline-light:focus {
      background: var(--surface-hover) !important;
      color: var(--text) !important;
      border-color: var(--border-2) !important;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="theme-toggle" id="themeToggle" title="Toggle theme">
    <div class="theme-toggle-thumb">
      <i class="bi bi-moon-fill" id="themeIcon" style="font-size:10px"></i>
    </div>
  </div>
  <main class="auth-page">
    <div class="auth-card">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    const html = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('sv-theme', theme);
      themeIcon.className = theme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    }

    const savedTheme = localStorage.getItem('sv-theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const nextTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
